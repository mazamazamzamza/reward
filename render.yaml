services:
  - type: web
    name: reward-telegram-bot
    env: python
    plan: starter  # recommandé (le plan gratuit met le service en veille après 15 min)
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: PORT
        value: 10000
